name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geodaily
          POSTGRES_PASSWORD: geodaily_secret
          POSTGRES_DB: geodaily
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geodaily -d geodaily"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://geodaily:geodaily_secret@localhost:5432/geodaily
      DEV_AUTH_BYPASS: true
      GEMINI_API_KEY: test-key
      JWT_SECRET: ci_jwt_secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare database schema and seed data
        run: |
          npm run db:push -- --force
          npm run db:seed

      - name: Run unit tests
        run: npm run test

      - name: Run API integration tests
        run: |
          npm run dev > /tmp/geodaily-dev.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            pkill -f "tsx server.ts" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              break
            fi
            sleep 2
          done
          npm run test:api

      - name: Run persistence E2E tests
        run: npx playwright test tests/e2e/persistence.spec.ts --reporter=line
