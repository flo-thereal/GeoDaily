services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=postgresql://${DB_USER:-geodaily}:${DB_PASSWORD:-geodaily_secret}@db:5432/${DB_NAME:-geodaily}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_in_production}
      - DEV_AUTH_BYPASS=${DEV_AUTH_BYPASS:-false}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-geodaily}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-geodaily_secret}
      - POSTGRES_DB=${DB_NAME:-geodaily}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-geodaily} -d ${DB_NAME:-geodaily}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
